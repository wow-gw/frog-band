<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#071820"/>
  <!-- Snare drum -->
  <ellipse cx="50" cy="87" rx="22" ry="5.5" fill="#8a1a1a"/>
  <rect x="28" y="82" width="44" height="6" fill="#c02020"/>
  <ellipse cx="50" cy="82" rx="22" ry="5.5" fill="#e02828"/>
  <!-- Drum rim -->
  <ellipse cx="50" cy="82" rx="22" ry="5.5" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <!-- Drum side bolts -->
  <circle cx="33" cy="84" r="1.5" fill="#888"/>
  <circle cx="50" cy="88" r="1.5" fill="#888"/>
  <circle cx="67" cy="84" r="1.5" fill="#888"/>
  <!-- Left drumstick -->
  <line x1="31" y1="70" x2="20" y2="32" stroke="#d4a840" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="20" cy="30" r="5" fill="#d4a840"/>
  <!-- Right drumstick -->
  <line x1="69" y1="70" x2="80" y2="32" stroke="#d4a840" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="80" cy="30" r="5" fill="#d4a840"/>
  <!-- Frog body -->
  <ellipse cx="50" cy="76" rx="20" ry="14" fill="#2ec872"/>
  <ellipse cx="50" cy="77" rx="13" ry="9" fill="#5effa8"/>
  <!-- Arms raised holding sticks -->
  <path d="M30,72 Q25,64 22,55" stroke="#2ec872" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M70,72 Q75,64 78,55" stroke="#2ec872" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="50" cy="53" r="20" fill="#2ec872"/>
  <circle cx="37" cy="39" r="11" fill="#2ec872"/>
  <circle cx="63" cy="39" r="11" fill="#2ec872"/>
  <circle cx="37" cy="39" r="8.5" fill="white"/>
  <circle cx="63" cy="39" r="8.5" fill="white"/>
  <!-- Focused pupils -->
  <circle cx="38" cy="40" r="4.5" fill="#0d1a15"/>
  <circle cx="64" cy="40" r="4.5" fill="#0d1a15"/>
  <circle cx="39" cy="38" r="2" fill="white"/>
  <circle cx="65" cy="38" r="2" fill="white"/>
  <circle cx="46" cy="57" r="1.8" fill="#22a855"/>
  <circle cx="54" cy="57" r="1.8" fill="#22a855"/>
  <!-- Determined straight mouth -->
  <path d="M40 63 Q50 68 60 63" stroke="#0d2a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
