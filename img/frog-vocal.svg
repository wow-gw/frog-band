<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#071820"/>
  <!-- Music notes -->
  <text x="70" y="28" font-size="13" fill="#00c8ff" opacity="0.8" font-family="serif">♪</text>
  <text x="14" y="34" font-size="10" fill="#3ddc84" opacity="0.6" font-family="serif">♫</text>
  <!-- Microphone handle -->
  <rect x="68" y="62" width="5" height="16" rx="2.5" fill="#aab0bb"/>
  <!-- Mic head -->
  <ellipse cx="70.5" cy="58" rx="5.5" ry="6.5" fill="#d0d4da"/>
  <ellipse cx="70.5" cy="58" rx="3.5" ry="5" fill="#888"/>
  <!-- Mic mesh lines -->
  <line x1="66" y1="56" x2="75" y2="56" stroke="#aaa" stroke-width="0.8" opacity="0.6"/>
  <line x1="66" y1="59" x2="75" y2="59" stroke="#aaa" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="50" cy="89" rx="20" ry="5" fill="#000" opacity="0.3"/>
  <ellipse cx="47" cy="77" rx="22" ry="16" fill="#2ec872"/>
  <ellipse cx="47" cy="78" rx="14" ry="10" fill="#5effa8"/>
  <!-- Left arm -->
  <ellipse cx="26" cy="74" rx="8" ry="5" fill="#2ec872" transform="rotate(-20 26 74)"/>
  <!-- Right arm holding mic -->
  <path d="M59,73 Q64,67 68,62" stroke="#2ec872" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="52" r="21" fill="#2ec872"/>
  <circle cx="37" cy="38" r="11" fill="#2ec872"/>
  <circle cx="63" cy="38" r="11" fill="#2ec872"/>
  <circle cx="37" cy="38" r="8.5" fill="white"/>
  <circle cx="63" cy="38" r="8.5" fill="white"/>
  <circle cx="38" cy="40" r="4.5" fill="#0d1a15"/>
  <circle cx="64" cy="40" r="4.5" fill="#0d1a15"/>
  <circle cx="39" cy="38" r="2" fill="white"/>
  <circle cx="65" cy="38" r="2" fill="white"/>
  <circle cx="44" cy="57" r="1.8" fill="#22a855"/>
  <circle cx="52" cy="57" r="1.8" fill="#22a855"/>
  <!-- Open singing mouth -->
  <path d="M38 64 Q50 76 62 64" stroke="#0d2a1a" stroke-width="2.5" fill="#0d2a1a" stroke-linecap="round"/>
  <ellipse cx="50" cy="70" rx="7" ry="4" fill="#ff4499"/>
  <ellipse cx="50" cy="67" rx="6" ry="3" fill="#ff69b4" opacity="0.6"/>
</svg>
